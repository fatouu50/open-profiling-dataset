name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate profiles and case records
        run: python3 scripts/validate.py

      - name: Check citation strings are normalised
        run: |
          python3 scripts/normalise_sources.py
          if ! git diff --exit-code dataset/ cases/; then
            echo "::error::Citations are not normalised. Run scripts/normalise_sources.py and commit."
            exit 1
          fi

      - name: Check Markdown reports match their JSON (profiles and cases)
        run: python3 scripts/render_md.py --check

      - name: Check index files are in sync
        run: |
          python3 scripts/build_index.py
          if ! git diff --exit-code index/; then
            echo "::error::index/ is out of sync. Run scripts/build_index.py and commit the result."
            exit 1
          fi
